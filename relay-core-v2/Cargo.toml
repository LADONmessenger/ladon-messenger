[package]
name = "ladon-relay-core-v2"
version = "0.2.0"
edition = "2021"
description = "Ladon v0.2 (L1) — wire formats and crypto primitives shared by entry-relay and exit-relay"

[dependencies]
# Hashing
blake3 = "1.5"
sha2 = "0.10"
hkdf = "0.12"
hmac = "0.12"

# AEAD
chacha20poly1305 = "0.10"

# Classical asymmetric
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
ed25519-dalek = { version = "2.1", features = ["std"] }

# Post-quantum (NIST Round 3 final, FIPS 203/204 candidates)
pqcrypto-kyber = "0.8"
pqcrypto-dilithium = "0.5"
pqcrypto-traits = "0.3"
oqs = { version = "0.11", default-features = false, features = ["std", "sigs", "ml_dsa", "vendored"] }

# Utilities
zeroize = { version = "1.7", features = ["derive"] }
subtle = "2.5"
rand_core = { version = "0.6", features = ["std"] }
getrandom = "0.2"
hex = "0.4"
thiserror = "1.0"

[dev-dependencies]
hex-literal = "0.4"

[features]
# Deterministic sealing for the cross-language vectors (A2 §4). Only the
# vector emitter enables it; no relay depends on it.
test-vectors = []

[[bin]]
name = "emit_test_vectors"
required-features = ["test-vectors"]
