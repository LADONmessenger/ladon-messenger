[package]
name = "entry-relay-v2"
version = "0.2.0"
edition = "2021"

[dependencies]
ladon-relay-core-v2 = { path = "../relay-core-v2" }

axum = "0.7"
tokio = { version = "1.40", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["limit", "trace"] }

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }

hmac = "0.12"
sha2 = "0.10"
rand = "0.8"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "entry-relay-v2"
path = "src/main.rs"

[dev-dependencies]
exit-relay-v2 = { path = "../exit-relay-v2" }
chacha20poly1305 = "0.10"
rand = "0.8"
blake3 = "1.5"
base64 = "0.22"
