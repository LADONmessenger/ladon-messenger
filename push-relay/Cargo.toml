[package]
name = "push-relay"
version = "0.2.0"
edition = "2021"

[dependencies]
ladon-relay-core-v2 = { path = "../relay-core-v2" }

# HTTP server + client (reqwest for APNs HTTP/2)
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1.40", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["limit", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }

# Crypto / encoding
hmac = "0.12"
sha2 = "0.10"
subtle = "2.5"
p256 = { version = "0.13", features = ["ecdsa", "pem", "pkcs8"] }
async-trait = "0.1"

# Util
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
base64 = "0.22"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
once_cell = "1.19"
# A2 §7: random push delay (OsRng)
rand = "0.8"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
pqcrypto-traits = "0.3"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json"] }

[[bin]]
name = "push-relay"
path = "src/main.rs"
