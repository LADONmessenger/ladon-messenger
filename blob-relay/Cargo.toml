[package]
name = "ladon-blob-relay"
version = "0.1.0"
edition = "2021"
description = "Ladon Blob Relay — encrypted attachment storage (Phase 3)"
publish = false

# FIX IN-05 (inherited convention): commit Cargo.lock to enforce reproducible builds.

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal", "time", "sync", "fs", "io-util"] }
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hkdf = "0.12"
hex = "0.4"
once_cell = "1.19"
aes-gcm = "0.10"
getrandom = { version = "0.2" }
base64 = "0.22"
subtle = "2.5"
ed25519-dalek = { version = "2.1", features = ["std", "rand_core"] }
rand = "0.8"
# `rand_core = 0.6` is what ed25519-dalek 2.1 expects.
rand_core = "0.6"
bytes = "1"
thiserror = "1"

[features]
test-helpers = []

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
hyper = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1

[lib]
name = "ladon_blob_relay"
path = "src/lib.rs"

[[bin]]
name = "ladon-blob-relay"
path = "src/main.rs"
